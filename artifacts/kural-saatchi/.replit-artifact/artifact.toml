kind = "web"
previewPath = "/"
title = "Kural Saatchi"
description = "A source-grounded Tamil quotation verifier for the Tirukkural. It checks text against the original couplets, explains exact and near matches, detects misattribution, and abstains when evidence is insufficient."
version = "1.0.0"
id = "artifacts/kural-saatchi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23307

[services.development]
run = "pnpm --filter @workspace/kural-saatchi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kural-saatchi", "run", "build" ]
serve = "static"
publicDir = "artifacts/kural-saatchi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23307"
BASE_PATH = "/"
